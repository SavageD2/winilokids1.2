<div class="app-shell">
  <header class="site-header">
    <a class="brand" routerLink="/">
      <span class="brand-mark">W</span>
      <span>
        <strong>Winilo Kids</strong>
        <small>Ateliers pour enfants et familles</small>
      </span>
    </a>

    <nav class="site-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Accueil
      </a>
      <a routerLink="/ateliers" routerLinkActive="active">Ateliers</a>
      <a routerLink="/inscription" routerLinkActive="active">Inscription</a>
      <a routerLink="/contact" routerLinkActive="active">Contact</a>
    </nav>
  </header>

  <main class="page-shell">
    <router-outlet />
  </main>

  <footer class="site-footer">
    <div>
      <strong>Winilo Kids</strong>
      <p>Une experience simple et rassurante pour aider les parents a reserver les bons ateliers.</p>
    </div>
    <div class="footer-links">
      <a routerLink="/ateliers">Voir les ateliers</a>
      <a routerLink="/inscription">Inscription</a>
      <a routerLink="/contact">Contact</a>
    </div>
  </footer>
</div>
