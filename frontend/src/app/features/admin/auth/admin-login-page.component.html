<section class="login-shell">
  <article class="login-copy">
    <p class="eyebrow">{{ 'adminLogin.hero.eyebrow' | translate }}</p>
    <h1>{{ 'adminLogin.hero.title' | translate }}</h1>
    <p>{{ 'adminLogin.hero.description' | translate }}</p>
    <a class="text-link" routerLink="/">{{ 'adminLogin.hero.backToPublic' | translate }}</a>
  </article>

  <form class="login-card" [formGroup]="loginForm" (ngSubmit)="submit()">
    <h2>{{ 'adminLogin.form.title' | translate }}</h2>

    <label>
      <span>{{ 'adminLogin.form.email' | translate }}</span>
      <input type="email" formControlName="email" placeholder="admin@winilo-kids.fr" />
    </label>

    <label>
      <span>{{ 'adminLogin.form.password' | translate }}</span>
      <input
        type="password"
        formControlName="password"
        [placeholder]="'adminLogin.form.passwordPlaceholder' | translate"
      />
    </label>

    @if (errorMessage()) {
      <p class="feedback feedback-error">{{ errorMessage() }}</p>
    }

    <button class="button button-primary" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        {{ 'adminLogin.form.submitting' | translate }}
      } @else {
        {{ 'adminLogin.form.submit' | translate }}
      }
    </button>
  </form>
</section>
